name: Run website automation tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-tests:
    name: ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: Cart page
            artifact: cart
            filter: CartPageFeatureFeature
          - feature: Checkout page
            artifact: checkout
            filter: CheckoutFeatureFeature
          - feature: Management page
            artifact: management
            filter: ManagemrentPageFeatureFeature
          - feature: Product page
            artifact: product
            filter: ProductPageFeatureFeature
          - feature: Sign in and sign up
            artifact: sign
            filter: SignInAndSignUpFeature
          - feature: Wishlist
            artifact: wishlist
            filter: WishlistFeatureFeature

    steps:
      - name: Check out automation tests
        uses: actions/checkout@v4

      - name: Build automation test image
        run: docker build -t automation-tests:ci .

      - name: Wait for the GitHub Pages website
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              https://tolga745.github.io/ > /dev/null; then
              exit 0
            fi
            echo "Website is not ready yet (attempt ${attempt}/12)"
            sleep 10
          done
          echo "GitHub Pages website did not become reachable"
          exit 1

      - name: Run Playwright tests
        run: |
          mkdir -p "test-results/${{ matrix.feature }}"
          docker run --rm \
            --env PLAYWRIGHT_HEADLESS=true \
            --volume "${{ github.workspace }}/.env.example:/src/.env:ro" \
            --volume "${{ github.workspace }}/test-results/${{ matrix.feature }}:/src/test-results" \
            automation-tests:ci \
            --filter "FullyQualifiedName~${{ matrix.filter }}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-results-${{ matrix.artifact }}
          path: test-results/${{ matrix.feature }}/
          if-no-files-found: warn
          retention-days: 30
